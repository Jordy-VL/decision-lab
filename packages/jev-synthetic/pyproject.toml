[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-synthetic"
version = "0.1.0"
description = "Bounded, provenance-preserving grounded decision data generation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1", "datasets>=3,<6", "langdetect==1.0.9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jev-data = "jev_synthetic.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
