[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modernbert-decisions"
version = "0.1.0"
description = "One text encoder, one bounded index head, three decision readouts"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "transformers>=4.50,<5", "accelerate>=0.26", "PyYAML>=6"]

[project.scripts]
decisions = "decisions.cli:main"

[tool.setuptools.packages.find]
include = ["decisions*"]
